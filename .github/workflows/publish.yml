name: Publish

# Builds the gallery page and index.json from main and deploys them to GitHub
# Pages. Only main: a pull request cannot publish anything, so a submission is
# invisible until a maintainer merges it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # each template's first-published date comes from history
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg (cuts each card's small clip and poster)
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - uses: actions/cache@v4
        with:
          path: .cache/cards
          key: cards-${{ hashFiles('templates/*/preview.*') }}
          restore-keys: cards-
      - run: node scripts/build.mjs
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
